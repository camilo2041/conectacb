server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sirve los .gz generados en el build (scripts/compress.mjs); comprime al vuelo solo lo que falte.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API de rutas (contenedor conectacb-api). El DNS de Docker se resuelve en cada petición,
    # así nginx arranca aunque la API todavía no esté lista.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://conectacb-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # La API no tiene página en "/": la raíz lleva a la documentación interactiva.
    location = /api {
        return 302 /api/docs;
    }

    location = /api/ {
        return 302 /api/docs;
    }

    # Crear, editar o borrar alertas no tiene autenticación en la API: desde internet solo se leen.
    location /api/alertas {
        limit_except GET HEAD { deny all; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        limit_except GET HEAD POST { deny all; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        add_header Cache-Control "no-store";
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # El HTML siempre se revalida para que cada despliegue se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
