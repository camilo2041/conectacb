server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sirve los .gz generados en el build (scripts/compress.mjs); comprime al vuelo solo lo que falte.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # El HTML siempre se revalida para que cada despliegue se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
